version: 1
components:
  comp_web_app:
    name: Web App
    kind: web_ui
    directory: apps/web
    stack:
      choices:
        styling: tailwindcss
        language: typescript
        framework: nextjs
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: Next.js chosen by the user over React + Vite; database not applicable
        — calls Platform API only
  comp_platform_api:
    name: Platform API
    kind: api_service
    directory: services/api
    stack:
      choices:
        database: postgresql
        language: typescript
        framework: nestjs
        package_manager: pnpm
        testing_tool_e2e: supertest
        testing_tool_unit: vitest
      notes: styling not applicable — API only; TypeScript for one language across
        the repo
  comp_background_worker:
    name: Background Worker
    kind: worker
    directory: services/worker
    stack:
      choices:
        language: typescript
        package_manager: pnpm
        testing_tool_unit: vitest
      notes: plain worker, no framework; no own datastore (uses the shared Relational
        Database); no externally called surface for e2e
  comp_relational_database:
    name: Relational Database
    kind: infrastructure
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS
  comp_object_storage:
    name: Object Storage
    kind: managed_service
    stack:
      choices:
        managed_service: Amazon S3

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web App — App shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype-utils.css">
<style>
  [data-arc-shell] { display: flex; flex-direction: column; min-height: 100vh; }
  .shell-header { border-bottom: var(--border-width) solid var(--color-border); background: var(--color-bg); }
  .shell-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--size-control-lg); flex-wrap: wrap; }
  .shell-brand { font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); color: var(--color-fg); text-decoration: none; }
  .shell-nav { display: none; width: 100%; padding-bottom: var(--space-2); }
  .shell-nav.is-open { display: block; }
  .shell-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .shell-nav a { display: block; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--color-fg); text-decoration: none; }
  .shell-nav a:hover { background: var(--color-surface); }
  .shell-nav a[aria-current="page"] { background: var(--color-info-bg); color: var(--color-info); font-weight: var(--font-weight-medium); }
  .shell-main { flex: 1; min-width: 0; padding-block: var(--space-4); }
  .shell-footer { border-top: var(--border-width) solid var(--color-border); padding-block: var(--space-3); color: var(--color-muted); font-size: var(--font-size-sm); }
  @media (min-width: 48em) {
    .shell-toggle { display: none; }
    .shell-nav { display: block; width: auto; padding-bottom: 0; }
    .shell-nav ul { flex-direction: row; }
  }
</style>
</head>
<body>
<div data-arc-shell>
  <header class="shell-header">
    <div class="container shell-bar">
      <a class="shell-brand" href="#">Web App</a>
      <button class="btn btn-secondary btn-icon shell-toggle" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-label="Menu">&#9776;</button>
      <nav class="shell-nav" id="main-nav" aria-label="Main">
        <ul>
          <li><a href="#" data-nav-key="home">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="shell-main">
    <div class="container" data-arc-content></div>
  </main>
  <footer class="shell-footer">
    <div class="container">Web App</div>
  </footer>
</div>
</body>
</html>
